services:
  pawprint:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pawprint
    restart: unless-stopped
    ports:
      - "3010:3010"
    environment:
      - NODE_ENV=production
      - PORT=3010
      - HOSTNAME=0.0.0.0
    networks:
      - default
      - tunnel

networks:
  tunnel:
    name: supabase_default
    external: true
