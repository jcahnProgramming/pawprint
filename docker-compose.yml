version: '3.8'

services:
  pawprint:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pawprint
    restart: unless-stopped
    ports:
      - "3010:3010"
    environment:
      - NODE_ENV=production
      - PORT=3010
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3010"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    labels:
      - "com.meownet.app=pawprint"
      - "com.meownet.description=Minecraft Schematic Builder"
```

---

Your project root should now look like:
```
~/Dev/pawprint/
├── Dockerfile              ← new
├── docker-compose.yml      ← new
├── .dockerignore           ← new
├── next.config.ts          ← updated
├── scripts/
│   ├── download-textures.sh  ← new
│   └── extract-textures.sh   ← existing
├── app/
├── components/
├── lib/
├── store/
└── public/